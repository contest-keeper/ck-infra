name: Deploy Hub (reusable)

# Plans and applies the Terraform in infra/azure for one environment. Other repositories call it
# (ck-hub does, after every develop build and every release); deploy-azure.yml runs it by hand.
#
# It signs in to Azure with OIDC: no password or client secret is stored anywhere. Each environment
# has its own Azure identity with rights on its own resource group only, and Azure only accepts
# tokens GitHub issues for that environment of the calling repository. Which people or builds may
# deploy is therefore decided by the GitHub environment (required reviewers, allowed branches).
#
# The non-secret identifiers come from GitHub variables (organization or repository level):
#   AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, TFSTATE_RESOURCE_GROUP, TFSTATE_STORAGE,
#   AZURE_CLIENT_ID_DEVELOP, AZURE_CLIENT_ID_PRODUCTION   (bootstrap.sh prints them)
#   OUTAGE_QUEUE   (per environment: true makes the queue and the proxy in front of the Hub. Run bootstrap.sh first)
#   HUB_DOMAIN, MAIL_DOMAIN   (per environment: where the Hub answers and sends mail from, for example hub.dev.contestkeeper.com
#                              and mail.dev.contestkeeper.com. Empty: no custom domain / no mail)
#   IMAGE_PUBLISHER_SUBJECT   (develop: the GitHub OIDC subject of the ck-os image workflow. Empty: no publisher identity)
#   NEON_ORG_ID   (the Neon organization of the database; not a secret)
#   CLOUDFLARE_ZONE_ID   (the zone of the custom domain; not a secret. Empty: Terraform makes no DNS records)

on:
  workflow_call:
    inputs:
      environment:
        description: develop or production
        required: true
        type: string
      image_tag:
        description: Hub image tag to run, such as 0.2.0 or sha-0123456789ab
        required: true
        type: string
      infra_ref:
        description: Branch of ck-infra whose Terraform to run, develop or main. Production must use main.
        required: true
        type: string
      apply:
        description: Apply the plan. When false, only show what would change.
        required: false
        default: true
        type: boolean
    secrets:
      registry_token:
        description: GitHub token with read:packages, to pull a private Hub image
        required: false
      cloudflare_token:
        description: Cloudflare API token that may edit DNS in the zone of the custom domain, and nothing else
        required: false
      config_signing_key:
        description: The key the Hub signs stick settings with (base64 seed). Empty means the Hub cannot sign.
        required: false
      neon_api_key:
        description: Neon API key that creates and changes the database project
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy at a time per environment, and never cancel one half way.
    concurrency:
      group: azure-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      INFRA_REF: ${{ inputs.infra_ref }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars[format('AZURE_CLIENT_ID_{0}', inputs.environment == 'production' && 'PRODUCTION' || 'DEVELOP')] }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_image: ghcr.io/contest-keeper/ck-hub:${{ inputs.image_tag }}
      TF_VAR_registry_password: ${{ secrets.registry_token }}
      TF_VAR_config_signing_key: ${{ secrets.config_signing_key }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      # Per environment, so another deployment (a contest's own Hub) only needs other variables. Empty: no custom domain / no mail.
      TF_VAR_custom_domain: ${{ vars.HUB_DOMAIN }}
      TF_VAR_outage_queue: ${{ vars.OUTAGE_QUEUE == 'true' }}
      TF_VAR_mail_domain: ${{ vars.MAIL_DOMAIN }}
      TF_VAR_image_publisher_subject: ${{ vars.IMAGE_PUBLISHER_SUBJECT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_token }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      NEON_API_KEY: ${{ secrets.neon_api_key }}
      TF_IN_AUTOMATION: "true"
      # Only whether it is set, never its value.
      HAS_SIGNING_KEY: ${{ secrets.config_signing_key != '' }}
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - name: Check the environment name
        run: |
          case "$ENVIRONMENT" in
            develop|production) ;;
            *) echo "environment must be develop or production" >&2; exit 1 ;;
          esac
          case "$INFRA_REF" in
            develop|main) ;;
            *) echo "infra_ref must be develop or main" >&2; exit 1 ;;
          esac
          if [ "$ENVIRONMENT" = production ] && [ "$INFRA_REF" != main ]; then
            echo "production deploys only run the Terraform on main" >&2; exit 1
          fi
          # Without the key Terraform removes it from the Hub, and the Hub then cannot sign stick settings.
          if [ "$ENVIRONMENT" = production ] && [ "$HAS_SIGNING_KEY" != true ]; then
            echo "production needs the config_signing_key secret: the caller must pass it" >&2; exit 1
          fi
        working-directory: .
      # The Terraform lives here, whichever repository called this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: contest-keeper/ck-infra
          ref: ${{ inputs.infra_ref }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.17.2
      - name: Set Terraform plugin cache directory
        run: |
          mkdir -p "$RUNNER_TEMP/tf-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/tf-plugin-cache
          key: tf-plugins-hub-linux-${{ hashFiles('infra/azure/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-hub-linux-
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Init
        env:
          STATE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          STATE_STORAGE: ${{ vars.TFSTATE_STORAGE }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${STATE_GROUP}" \
            -backend-config="storage_account_name=${STATE_STORAGE}" \
            -backend-config="container_name=tfstate-${ENVIRONMENT}" \
            -backend-config="key=ck-hub-${ENVIRONMENT}.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
      - name: Plan
        run: |
          terraform plan -input=false -var-file="environments/${ENVIRONMENT}.tfvars" -out=tfplan
          # Only the resource addresses and actions, never values, so no secret can reach the summary.
          {
            echo "### Terraform plan (${ENVIRONMENT}, ck-infra ${INFRA_REF})"
            echo
            echo '```'
            terraform show -no-color tfplan | grep -E '^ +# |^Plan:|^No changes' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: inputs.apply
        run: terraform apply -input=false tfplan
      - name: Show the address
        if: inputs.apply
        run: |
          {
            echo "### Keeper Hub (${ENVIRONMENT}) ${{ inputs.image_tag }}"
            echo
            echo "Address: $(terraform output -raw hub_url)"
            echo "Container app: $(terraform output -raw container_app)"
            echo "Key Vault: $(terraform output -raw key_vault)"
            proxy="$(terraform output -raw ingress_url 2>/dev/null || true)"
            if [[ "$proxy" == https://* ]]; then echo "Status page: ${proxy}/status"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The develop copy sleeps when idle, so give it time to wake up.
      - name: Check the Hub answers and can sign
        if: inputs.apply
        run: |
          url="$(terraform output -raw hub_url)"
          for attempt in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/" || true)"
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ]; then break; fi
            if [ "$attempt" = 12 ]; then echo "The Hub at ${url} did not answer after the deploy" >&2; exit 1; fi
            sleep 10
          done
          # The proxy in front of the Hub: its own page, and the Hub through it.
          # Production runs the Terraform of main, which may not have the output yet; it is empty when the
          # queue is off.
          proxy="$(terraform output -raw ingress_url 2>/dev/null || true)"
          if [[ "$proxy" == https://* ]]; then
            for path in /status /; do
              # curl's own failure counts too: an answer can say 200 and never finish.
              if ! code="$(curl -s -o /dev/null -w '%{http_code}' --retry 6 --retry-all-errors --retry-delay 10 --max-time 30 "$proxy$path")" || [ "$code" != 200 ]; then
                echo "The proxy at ${proxy} does not answer ${path} (HTTP ${code})" >&2; exit 1
              fi
              echo "proxy ${path}: HTTP ${code}"
            done
          fi
          # The public key route answers 200 only when the Hub holds a signing key (404 otherwise).
          if [ "$HAS_SIGNING_KEY" = true ]; then
            code="$(curl -s -o key.json -w '%{http_code}' --max-time 20 "$url/api/v1/config-signing-key" || true)"
            echo "signing key route: HTTP ${code}"
            if [ "$code" != 200 ] || ! jq -e '.public_key | length > 0' key.json > /dev/null; then
              echo "The Hub is up but holds no signing key" >&2; exit 1
            fi
          fi
