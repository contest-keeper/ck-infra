name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  common:
    uses: contest-keeper/.github/.github/workflows/common-ci.yml@8fbe95f9a4f5d61ac65d8eb046f142b371db790e # main
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false -input=false
        working-directory: infra/azure
      - run: terraform validate
        working-directory: infra/azure
      - run: terraform init -backend=false -input=false
        working-directory: infra/website
      - run: terraform validate
        working-directory: infra/website
  # The README says the workflows and shell scripts are checked. shellcheck is on the runner; actionlint is
  # built from its pinned release.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck --severity=warning infra/azure/bootstrap.sh
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the compose file
        run: docker compose config -q
        working-directory: compose
        env:
          POSTGRES_PASSWORD: not-a-real-password
          CK_DOMAIN: hub.example.org
