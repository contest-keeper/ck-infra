name: Deploy Website (reusable)

# Makes sure the static site's storage account exists for one environment, then uploads the built
# site to it. The calling workflow builds the site and uploads it as an artifact first. It signs in to
# Azure with OIDC like deploy.yml: no password or client secret is stored anywhere.

on:
  workflow_call:
    inputs:
      environment:
        description: develop or production
        required: true
        type: string
      artifact:
        description: Name of the workflow artifact that holds the built site
        required: true
        type: string
      infra_ref:
        description: Branch of ck-infra whose Terraform to run, develop or main.
        required: true
        type: string
    secrets:
      cloudflare_token:
        description: Cloudflare API token that may edit DNS records and Worker routes in the zone of the public name and Worker scripts in the account, and nothing else
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  site:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: azure-website-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      INFRA_REF: ${{ inputs.infra_ref }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars[format('AZURE_CLIENT_ID_{0}', inputs.environment == 'production' && 'PRODUCTION' || 'DEVELOP')] }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      # Per environment (empty: only the storage address).
      TF_VAR_public_hostname: ${{ vars.WEBSITE_DOMAIN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_token }}
    steps:
      - name: Check the environment name
        run: |
          case "$ENVIRONMENT" in
            develop|production) ;;
            *) echo "environment must be develop or production" >&2; exit 1 ;;
          esac
          case "$INFRA_REF" in
            develop|main) ;;
            *) echo "infra_ref must be develop or main" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: contest-keeper/ck-infra
          ref: ${{ inputs.infra_ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact }}
          path: site-dist
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Set Terraform plugin cache directory
        run: |
          mkdir -p "$RUNNER_TEMP/tf-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/tf-plugin-cache
          key: terraform-plugins-linux-${{ hashFiles('infra/**/.terraform.lock.hcl', 'infra/**/versions.tf') }}
          restore-keys: terraform-plugins-linux-
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Make the storage account
        working-directory: infra/website
        env:
          STATE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          STATE_STORAGE: ${{ vars.TFSTATE_STORAGE }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${STATE_GROUP}" \
            -backend-config="storage_account_name=${STATE_STORAGE}" \
            -backend-config="container_name=tfstate-${ENVIRONMENT}" \
            -backend-config="key=ck-website-${ENVIRONMENT}.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          terraform apply -input=false -auto-approve -var-file="environments/${ENVIRONMENT}.tfvars"
          echo "ACCOUNT=$(terraform output -raw storage_account)" >> "$GITHUB_ENV"
          echo "SITE_URL=$(terraform output -raw public_url)" >> "$GITHUB_ENV"
      - name: Upload the site
        run: |
          az storage blob upload-batch --account-name "$ACCOUNT" --auth-mode login \
            --destination "\$web" --source site-dist --overwrite --only-show-errors
      - name: Show the address
        run: |
          {
            echo "### Contest Keeper website (${ENVIRONMENT})"
            echo
            echo "Address: ${SITE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
