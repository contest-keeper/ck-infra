# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  auto_review:
    enabled: true
    base_branches: ["^develop$"]
    ignore_usernames: ["dependabot[bot]"]
  tools:
    shellcheck:
      enabled: true
    clippy:
      enabled: true
  path_instructions:
    - path: "infra/**"
      instructions: |
        Terraform for the Hub on Azure. Check for public network exposure (firewall rules, public access), secrets in state or variables, least-privilege role assignments and identities, and that nothing is applied outside the pipelines.
